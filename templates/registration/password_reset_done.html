{% extends "base.html" %}

{% block title %}Email Sent - Expense Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center" style="min-height: 80vh; align-items: center;">
  <div class="col-md-5 col-lg-4">
    <div class="content-card text-center" style="padding:40px 32px;">
      <div style="font-size:3rem; margin-bottom:16px;">📧</div>
      <h2 style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:1.4rem; margin-bottom:12px;">Check Your Email</h2>
      <p style="color:var(--text-muted); font-size:0.9rem; line-height:1.6;">If an account exists with that email address, we've sent a password reset link. Please check your inbox.</p>
      <a href="{% url 'login' %}" class="btn-primary-custom mt-3" style="justify-content:center;">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
