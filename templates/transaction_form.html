{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h2 class="mb-4">{{ title }}</h2>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Amount (KES)</label>
          {{ form.amount }}
        </div>
        <div class="mb-3">
          <label class="form-label">Type</label>
          {{ form.type }}
        </div>
        <div class="mb-3">
          <label class="form-label">Category</label>
          {{ form.category }}
        </div>
        <div class="mb-3">
          <label class="form-label">Date</label>
          {{ form.date }}
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          {{ form.description }}
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary w-100">Save Transaction</button>
          <a href="{% url 'transaction_list' %}" class="btn btn-outline-secondary w-100">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
